[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aireport"
version = "0.1.0"
description = "Local-first AI 会话日报/周报聚合器：在本机聚合多个 AI 工具的会话记录，按项目分类生成日报/周报（Markdown / Word），并提供 MCP 服务供 AI 工具调用"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "report", "daily-report", "mcp", "skill", "local-first", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
]
# 运行时零三方依赖：核心功能只用 Python 标准库
dependencies = []
authors = [{ name = "Aiscribe contributors" }]

[project.scripts]
aireport = "ai_report.cli:main"

[tool.setuptools]
packages = ["ai_report", "ai_report.connectors"]

[tool.setuptools.package-data]
# 引导页单页（内嵌 CSS/JS），需要随包分发
ai_report = ["web/*.html"]
