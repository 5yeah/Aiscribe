<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiscribe · 本机 AI 工作总结</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- 引导页这一层允许用 CDN（MCP 内核仍是零依赖 stdio，与本页无关） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        fontFamily: {
          heading: ['"Instrument Serif"', 'Georgia', '"Songti SC"', 'serif'],
          body: ['"Barlow"', '"PingFang SC"', 'system-ui', 'sans-serif'],
        },
        borderRadius: { DEFAULT: '9999px' },
      },
    },
  };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

<style>
/* ============================================================
   一、token：品牌绿 + 深浅双模式（对比度都按 WCAG AA 调过）
   数据全程本机，页面本身不联网；只有 CDN 那五个文件需要公网。
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #EDF3EF;
  --tint-1: rgba(5, 153, 79, .30);
  --tint-2: rgba(39, 210, 191, .28);
  --tint-3: rgba(128, 193, 255, .26);
  --glass-fill-card: rgba(255, 255, 255, .58);
  --glass-strong-fill: rgba(255, 255, 255, .74);
  --text: #16201B;
  --text-muted: #4A5A52;
  --border: rgba(22, 32, 27, .12);
  --brand: #05994F;
  --brand-on: #FFFFFF;
  --brand-soft: rgba(5, 153, 79, .10);
  --brand-ring: rgba(5, 153, 79, .28);
  --danger: #C0392B;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0A0D0C;
    --tint-1: rgba(50, 240, 140, .17);
    --tint-2: rgba(39, 210, 191, .14);
    --tint-3: rgba(100, 180, 255, .15);
    --glass-fill-card: rgba(28, 34, 31, .55);
    --glass-strong-fill: rgba(20, 26, 23, .72);
    --text: #ECF3EE;
    --text-muted: #9BAAA2;
    --border: rgba(255, 255, 255, .14);
    --brand: #32F08C;
    --brand-on: #04321C;
    --brand-soft: rgba(50, 240, 140, .14);
    --brand-ring: rgba(50, 240, 140, .30);
    --danger: #FF8A7A;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'Barlow', 'PingFang SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button { cursor: pointer; font: inherit; color: inherit; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.c-text { color: var(--text); }
.c-muted { color: var(--text-muted); }
.c-brand { color: var(--brand); }

/* ============================================================
   二、液态玻璃（原样保留的质感核心）
   .liquid-glass   导航 / 胶囊 / 标签 / 卡片
   .liquid-glass-strong  主 CTA
   ============================================================ */
.liquid-glass {
  background: rgba(255, 255, 255, 0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
}
.liquid-glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
    rgba(255,255,255,0) 40%,   rgba(255,255,255,0) 60%,
    rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.liquid-glass-strong {
  background: rgba(255, 255, 255, 0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(50px);
  -webkit-backdrop-filter: blur(50px);
  border: none;
  box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.15);
  position: relative;
  overflow: hidden;
}
.liquid-glass-strong::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 20%,
    rgba(255,255,255,0) 40%,   rgba(255,255,255,0) 60%,
    rgba(255,255,255,0.2) 80%, rgba(255,255,255,0.5) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

/* 内容卡片在规格的 1% 白底之上补一层 token 雾面，密集小字才看得清 */
.glass-card {
  background: var(--glass-fill-card) !important;
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
}
.glass-strong {
  background: var(--glass-strong-fill) !important;
  backdrop-filter: blur(26px) saturate(150%);
  -webkit-backdrop-filter: blur(26px) saturate(150%);
}

/* 不支持毛玻璃时退回近乎实底 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass-fill-card: rgba(255,255,255,.96); --glass-strong-fill: rgba(255,255,255,.97); }
  @media (prefers-color-scheme: dark) {
    :root { --glass-fill-card: rgba(26,32,29,.96); --glass-strong-fill: rgba(20,26,23,.97); }
  }
}

/* ============================================================
   三、背景层：纯 CSS 光晕，无任何视频 / 图片 / 外链媒体
   ============================================================ */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  transition: filter 700ms ease;
}
.aurora i { position: absolute; display: block; border-radius: 50%; }
.aurora .b1 {
  width: 74vmax; height: 74vmax; left: -18vmax; top: -24vmax;
  background: radial-gradient(circle at 50% 50%, var(--tint-1), transparent 68%);
  animation: drift1 48s ease-in-out infinite;
}
.aurora .b2 {
  width: 64vmax; height: 64vmax; right: -16vmax; top: -16vmax;
  background: radial-gradient(circle at 50% 50%, var(--tint-3), transparent 70%);
  animation: drift2 56s ease-in-out infinite;
}
.aurora .b3 {
  width: 82vmax; height: 82vmax; left: 18vmax; bottom: -36vmax;
  background: radial-gradient(circle at 50% 50%, var(--tint-2), transparent 72%);
  animation: drift3 64s ease-in-out infinite;
}
@keyframes drift1 { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(3vmax, 4vmax, 0); } }
@keyframes drift2 { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(-4vmax, 3vmax, 0); } }
@keyframes drift3 { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(2vmax, -4vmax, 0); } }
@media (prefers-reduced-motion: reduce) {
  .aurora { transition: none; }
  .aurora i { animation: none; }
}

/* ============================================================
   四、控件与小组件
   ============================================================ */
.ginput {
  background: var(--glass-fill-card);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
  border-radius: 12px;
  padding: 7px 10px;
  color: var(--text);
  font-family: 'Barlow', 'PingFang SC', system-ui, sans-serif;
  font-size: 13px;
  line-height: 18px;
}
.ginput::placeholder { color: var(--text-muted); }
.ginput-lg { border-radius: 14px; padding: 10px 14px; font-size: 14px; }

.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; }
.seg > button { border-radius: 999px; padding: 6px 14px; font-size: 13px; line-height: 20px; color: var(--text-muted); transition: color .15s ease, background .15s ease; }
.seg > button:hover { color: var(--text); }
.seg > button[data-on="1"] { background: var(--brand); color: var(--brand-on); }

.chip {
  display: inline-flex; align-items: center; gap: 8px;
  border-radius: 999px; padding: 6px 12px 6px 10px;
  font-size: 12px; line-height: 18px;
  color: var(--text-muted);
  transition: color .15s ease, border-color .15s ease, opacity .15s ease;
}
.chip[data-on="1"] { color: var(--text); }
.chip[data-on="0"] { opacity: .55; }
.chip[data-trim="1"] { border-style: dashed !important; }
.chip .lb { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .sc { flex: none; border-radius: 999px; padding: 2px 7px; color: var(--text-muted); font-size: 12px; line-height: 16px; }
.chip .sc:hover { color: var(--brand); }
.chip .bdg { flex: none; color: var(--brand); font-size: 11px; line-height: 16px; }

/* 模板/选项整行：不用 .chip，免得与 Tailwind 的 padding 工具类抢优先级 */
.optrow {
  display: flex; align-items: flex-start; gap: 10px;
  border-radius: 20px; padding: 14px 16px;
  color: var(--text-muted);
  transition: color .15s ease, opacity .15s ease;
}
.optrow[data-on="1"] { color: var(--text); }
.optrow[data-on="0"] { opacity: .62; }

/* 勾选框：.chip 与 .optrow 共用，直接子元素定位 */
.box {
  width: 14px; height: 14px; flex: none; border-radius: 4px;
  border: 1.5px solid var(--text-muted); position: relative;
}
.optrow > .box { margin-top: 3px; }
[data-on="1"] > .box { border-color: var(--brand); background: var(--brand); }
[data-on="1"] > .box::after {
  content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 4px; height: 8px;
  border: solid var(--brand-on); border-width: 0 2px 2px 0; transform: rotate(45deg);
}

.tag {
  display: inline-flex; align-items: center;
  border-radius: 999px; padding: 2px 9px;
  font-size: 11px; line-height: 16px; color: var(--text-muted);
  border: 1px solid var(--border);
}
.tag-hi { color: var(--brand); border-color: var(--brand); }

.step-live { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 3px var(--brand-ring); }
  50%      { box-shadow: 0 0 0 7px rgba(0, 0, 0, 0); }
}
@media (prefers-reduced-motion: reduce) { .step-live { animation: none; box-shadow: 0 0 0 4px var(--brand-ring); } }

.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

.lamp { width: 8px; height: 8px; border-radius: 999px; flex: none; background: var(--text-muted); }
.lamp-on { background: var(--brand); }

.scroll-y { overflow-y: auto; }
.scroll-y::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll-y::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

.drop {
  border: 1px dashed var(--border);
  border-radius: 16px;
  transition: border-color .15s ease, background .15s ease;
}
.drop[data-over="1"] { border-color: var(--brand); }

/* 骨架预览：两种模板排版一眼能看出差别 */
.sk-p { font-size: 14px; line-height: 22px; font-weight: 500; padding-top: 8px; color: var(--text); }
.sk-p:first-child { padding-top: 0; }
.sk-i { display: flex; gap: 8px; padding-top: 4px; }
.sk-i b { color: var(--brand); font-weight: 500; flex: none; }
.sk-i span { color: var(--text-muted); font-size: 12px; line-height: 18px; }

/* 断网兜底：CDN 取不到时给一句人话，而不是白屏 */
#boot-fallback {
  display: none;
  position: relative;
  z-index: 99;
  max-width: 640px;
  margin: 12vh auto;
  padding: 28px 30px;
  border: 1px solid #cfe0d6;
  border-radius: 16px;
  background: #fff;
  color: #16201B;
  font: 400 14px/22px 'PingFang SC', system-ui, sans-serif;
}
#boot-fallback h1 { font-size: 18px; margin: 0 0 10px; }
#boot-fallback code { background: #eef3f0; border-radius: 6px; padding: 2px 6px; }
#boot-fallback button { margin-top: 16px; padding: 8px 16px; border-radius: 999px; border: 0; background: #05994F; color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>

<div id="boot-fallback">
  <h1>引导页的界面库没加载出来</h1>
  <p>这个引导页要用公网 CDN 上的 Tailwind / React / Framer Motion。看起来当前网络不通（或 CDN 被挡了）。</p>
  <p>不影响报告能力：你仍可以直接用 <code>python -m ai_report daily --date 2026-10-16 --format md</code>，
     或让 AI 客户端经 MCP 的 <code>get_conversations</code> 取素材。</p>
  <button type="button" onclick="location.reload()">重试</button>
</div>

<div id="root"></div>

<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    if (!(window.React && window.ReactDOM && window.Motion)) {
      var fb = document.getElementById('boot-fallback');
      if (fb) { fb.style.display = 'block'; }
      var root = document.getElementById('root');
      if (root) { root.style.display = 'none'; }
    }
  }, 2500);
});

// framer-motion 的 motion.* 组件会把无 key 的静态兄弟子元素当成列表，
// 于是 dev 版 React 会刷一条「unique key」警告（本页所有 .map 列表都自带 key）。
// 只过滤这一条，其它 console.error 原样保留。
(function () {
  var raw = console.error;
  console.error = function () {
    if (typeof arguments[0] === 'string' && arguments[0].indexOf('unique "key" prop') >= 0) { return; }
    return raw.apply(console, arguments);
  };
})();
</script>

<script type="text/babel">
(function () {
  if (!window.React || !window.ReactDOM || !window.Motion) { return; }

  var React = window.React;
  var ReactDOM = window.ReactDOM;
  var FM = window.Motion;
  var motion = FM.motion;
  var AnimatePresence = FM.AnimatePresence;
  var useReduced = FM.useReducedMotion || function () { return false; };
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;

  // ------------------------------------------------------------
  // 通用工具
  // ------------------------------------------------------------

  function api(path, options) {
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) { throw new Error(body.error || ('HTTP ' + res.status)); }
        return body;
      });
    });
  }

  function post(path, payload) {
    return api(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayIso() { return isoOf(new Date()); }
  function shiftDays(iso, n) {
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return isoOf(d);
  }
  function weekRange(iso) {
    var d = new Date(iso + 'T00:00:00');
    var back = (d.getDay() + 6) % 7;           // 周一 = 0
    var mon = new Date(d); mon.setDate(d.getDate() - back);
    var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { start: isoOf(mon), end: isoOf(sun) };
  }

  function convQuery(mode, date, start, end, detail) {
    var q = '/api/conversations?mode=' + mode + '&detail=' + (detail || 'summary');
    if (mode === 'range') { q += '&start=' + start + '&end=' + end; }
    else { q += '&date=' + date; }
    return q;
  }

  function cleanTitle(rec) {
    var text = (rec.title || rec.summary || '').replace(/\[[^\]]*\]/g, '')
      .replace(/@image:[^\s]+/g, '').replace(/\s+/g, ' ').trim();
    return text || '(无标题会话)';
  }
  function clip(text, n) { return text.length > n ? text.slice(0, n) + '…' : text; }
  function startTime(rec) { return (rec.time || '').split('~')[0]; }

  // BlurText 分词：英文按空格，中文按字（不然一整句只会是一个词）
  function splitWords(text) {
    var out = [];
    String(text || '').split(/\s+/).filter(Boolean).forEach(function (tok) {
      if (/[\u4e00-\u9fa5]/.test(tok) && tok.length > 1) {
        Array.prototype.forEach.call(tok, function (ch) { out.push(ch); });
      } else { out.push(tok); }
    });
    return out;
  }

  function fadeUp(reduced, delay) {
    return {
      initial: reduced ? { opacity: 0 } : { filter: 'blur(10px)', opacity: 0, y: 20 },
      animate: reduced ? { opacity: 1 } : { filter: 'blur(0px)', opacity: 1, y: 0 },
      transition: { duration: reduced ? 0 : 0.6, ease: 'easeOut', delay: reduced ? 0 : (delay || 0) },
    };
  }

  function pageVariants(reduced) {
    return {
      enter: function (d) {
        return { x: reduced ? 0 : (d > 0 ? 32 : -32), opacity: 0, filter: reduced ? 'blur(0px)' : 'blur(10px)' };
      },
      center: function () {
        return { x: 0, opacity: 1, filter: 'blur(0px)',
          transition: reduced ? { duration: 0 } : { duration: 0.32, ease: 'easeOut' } };
      },
      exit: function (d) {
        return { x: reduced ? 0 : (d > 0 ? -24 : 24), opacity: 0, filter: reduced ? 'blur(0px)' : 'blur(6px)',
          transition: reduced ? { duration: 0 } : { duration: 0.22, ease: 'easeOut' } };
      },
    };
  }

  // ------------------------------------------------------------
  // 基础组件
  // ------------------------------------------------------------

  function BlurText(props) {
    var ref = useRef(null);
    var reduced = useReduced();
    var st = useState(false);
    var on = st[0], setOn = st[1];

    useEffect(function () {
      var node = ref.current;
      if (!node) { return; }
      if (typeof IntersectionObserver === 'undefined') { setOn(true); return; }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { setOn(true); io.disconnect(); } });
      }, { threshold: 0.1 });
      io.observe(node);
      return function () { io.disconnect(); };
    }, []);

    var words = splitWords(props.text);
    return (
      <p ref={ref}
         className={props.className || ''}
         style={{ display: 'flex', flexWrap: 'wrap', justifyContent: props.align || 'center', rowGap: '.1em', margin: 0 }}>
        {words.map(function (w, i) {
          var cjk = /[\u4e00-\u9fa5]/.test(w) && w.length === 1;
          var base = { display: 'inline-block', marginRight: cjk ? '0.1em' : '0.28em' };
          if (!on || reduced) {
            return <span key={i} style={base} className={props.wordClassName || ''}>{w}</span>;
          }
          return (
            <motion.span key={i} style={base} className={props.wordClassName || ''}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={{ filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'], opacity: [0, 0.5, 1], y: [50, -5, 0] }}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}>
              {w}
            </motion.span>
          );
        })}
      </p>
    );
  }

  function RollNumber(props) {
    var reduced = useReduced();
    var st = useState(0);
    var v = st[0], setV = st[1];
    useEffect(function () {
      var target = props.value || 0;
      if (reduced) { setV(target); return; }
      var from = 0, started = Date.now(), dur = 700, raf = 0;
      var step = function () {
        var t = Math.min(1, (Date.now() - started) / dur);
        var e = 1 - Math.pow(1 - t, 3);
        setV(Math.round(from + (target - from) * e));
        if (t < 1) { raf = requestAnimationFrame(step); }
      };
      raf = requestAnimationFrame(step);
      return function () { cancelAnimationFrame(raf); };
    }, [props.value, reduced]);
    return <span>{v.toLocaleString('zh-CN')}</span>;
  }

  function Kicker(props) {
    return <p className="c-muted mb-3 text-xs tracking-[0.2em]">{props.children}</p>;
  }

  function Lamp(props) {
    return <span className={'lamp' + (props.on ? ' lamp-on' : '')}></span>;
  }

  function Stepper(props) {
    var steps = [1, 2, 3, 4];
    var cur = props.current;
    return (
      <div className="flex items-center gap-1.5 md:gap-2" role="tablist" aria-label="步骤">
        {steps.map(function (n, i) {
          var done = n < cur;
          var active = n === cur;
          var reachable = n <= cur;
          var style = {};
          if (active) {
            style.background = 'var(--brand)';
            style.color = 'var(--brand-on)';
            style.boxShadow = '0 0 0 3px var(--brand-ring)';
          } else if (done) {
            style.border = '1px solid var(--brand)';
            style.color = 'var(--brand)';
            style.background = 'var(--brand-soft)';
          } else {
            style.border = '1px solid var(--border)';
            style.color = 'var(--text-muted)';
          }
          return (
            <React.Fragment key={n}>

  // ------------------------------------------------------------

  function Splash(props) {
    var reduced = useReduced();
    var st = useState('');
    var err = st[0], setErr = st[1];
    var st2 = useState(0);
    var tryCount = st2[0], setTryCount = st2[1];
    var listRef = useRef(null);

    // 预取 /api/sources 与「至少 1.2s」取较晚者，既不闪屏也不空等
    useEffect(function () {
      var alive = true;
      var ready = false, minDone = false, fired = false;
      var fire = function () {
        if (!alive || fired || !ready || !minDone) { return; }
        fired = true;
        props.onDone(listRef.current || []);
      };
      var timer = setTimeout(function () { minDone = true; fire(); }, 1200);
      api('/api/sources').then(function (list) {
        if (!alive) { return; }
        listRef.current = list;
        ready = true; fire();
      }).catch(function (e) {
        if (!alive) { return; }
        setErr(e.message || '读取数据源失败');
      });
      return function () { alive = false; clearTimeout(timer); };
    }, [tryCount]);

    return (
      <motion.div
        className="fixed inset-0 z-30 flex flex-col items-center justify-center px-6"
        style={{ background: 'var(--bg)' }}
        initial={{ opacity: 0 }} animate={{ opacity: 1 }}

    if (style.project_kind === 'hash') { return idx + punct + clean; }
    if (style.project_kind === 'plain-arabic' || style.project_kind === 'bold-arabic') { return idx + punct + clean + '：'; }
    return idx + punct + clean;

                    {report.total} 条素材 · {report.projects} 个项目 · {String(report.format).toUpperCase()}
                  </span>
                  <a className="liquid-glass-strong rounded-full px-4 py-2 text-xs font-medium c-text"
                     href={report.url} target="_blank" rel="noreferrer">
                    {report.format === 'html' ? '在浏览器打开' : '打开报告'}
                  </a>
                  <a className="c-muted text-xs font-body hover:c-text"
                     href={report.url} download={report.name}>下载到本地</a>
                </div>
                {report.format === 'md' ? (
                  <textarea readOnly value={report.text} rows={8}
                    className="ginput scroll-y mt-3 w-full font-mono text-xs" />
                ) : (
                  <p className="c-muted mt-3 text-xs font-body">
                    {report.format === 'docx' ? 'Word 文件已落盘，点「下载到本地」保存。'
                                               : '自包含 HTML，可直接分享给他人。'}
                  </p>
                )}
              </motion.div>
            ) : null}

            <p className="c-muted mt-6 text-xs font-body">交给 AI 客户端的指令（可复制）</p>
            <textarea readOnly value={text} rows={6}
              className="ginput scroll-y mt-2 w-full font-mono text-xs" />
          </motion.div>
        ) : null}
      </motion.div>
    );
  }

  // ------------------------------------------------------------
  // App：六屏调度、状态、与后端接口的唯一接触面
  // ------------------------------------------------------------

  function App() {
    var reduced = useReduced();
    var st = useState('splash');
    var screen = st[0], setScreen = st[1];
    var stDir = useState(1);
    var dir = stDir[0], setDir = stDir[1];

    var stSrc = useState(null);
    var sources = stSrc[0], setSources = stSrc[1];
    var stScan = useState({});
    var scan = stScan[0], setScan = stScan[1];
    var stProg = useState({ done: 0, total: 0, count: 0 });
    var progress = stProg[0], setProgress = stProg[1];
    var stScanDone = useState(false);
    var scanDone = stScanDone[0], setScanDone = stScanDone[1];
    var scanRef = useRef(false);

    var stMode = useState('daily');
    var mode = stMode[0], setMode = stMode[1];
    var stDate = useState(todayIso());
    var date = stDate[0], setDate = stDate[1];
    var stStart = useState(shiftDays(todayIso(), -6));
    var start = stStart[0], setStart = stStart[1];
    var stEnd = useState(todayIso());
    var end = stEnd[0], setEnd = stEnd[1];

    var stPayload = useState(null);
    var payload = stPayload[0], setPayload = stPayload[1];
    var stLoad = useState(false);
    var loading = stLoad[0], setLoading = stLoad[1];
    var stConvErr = useState('');
    var convErr = stConvErr[0], setConvErr = stConvErr[1];

    var stChecked = useState({});
    var checked = stChecked[0], setChecked = stChecked[1];
    var stTrims = useState({});
    var trims = stTrims[0], setTrims = stTrims[1];
    var stTrimErr = useState('');
    var trimErr = stTrimErr[0], setTrimErr = stTrimErr[1];
    var stTrimRec = useState(null);
    var trimRec = stTrimRec[0], setTrimRec = stTrimRec[1];

    var stTpls = useState([]);
    var templates = stTpls[0], setTemplates = stTpls[1];
    var stTplSel = useState('');
    var tplSel = stTplSel[0], setTplSel = stTplSel[1];
    var stTplDetail = useState(null);
    var tplDetail = stTplDetail[0], setTplDetail = stTplDetail[1];
    var stTplLoaded = useState(false);
    var tplLoaded = stTplLoaded[0], setTplLoaded = stTplLoaded[1];
    var stLearnName = useState('');
    var learnName = stLearnName[0], setLearnName = stLearnName[1];
    var stLearnNote = useState('本机解析，样例不上传；只学排版，不搬内容。');
    var learnNote = stLearnNote[0], setLearnNote = stLearnNote[1];
    var stTplErr = useState('');
    var tplErr = stTplErr[0], setTplErr = stTplErr[1];
    var stFmt = useState('md');
    var fmt = stFmt[0], setFmt = stFmt[1];

    var stSession = useState(0);
    var session = stSession[0], setSession = stSession[1];

    var stepNum = screen === 'gen' ? 5 : (typeof screen === 'number' ? screen : 0);

    // ---- ① 逐源真实扫描（串行，读完才点亮）----
    useEffect(function () {
      if (screen !== 1 || !sources || scanRef.current) { return; }
      scanRef.current = true;
      var usable = sources.filter(function (s) { return s.available; });
      var done = 0, total = 0, alive = true;
      setProgress({ done: 0, total: usable.length, count: 0 });
      var chain = Promise.resolve();
      usable.forEach(function (src) {
        chain = chain.then(function () {
          if (!alive) { return; }
          setScan(function (prev) { var n = Object.assign({}, prev); n[src.name] = { state: 'scan' }; return n; });
          return api('/api/source?name=' + encodeURIComponent(src.name)).then(function (data) {
            if (!alive) { return; }
            setScan(function (prev) {
              var n = Object.assign({}, prev);
              n[src.name] = { state: data.available ? 'ok' : 'off', count: data.count };
              return n;
            });
            total += data.count;
          }).catch(function () {
            if (!alive) { return; }
            setScan(function (prev) { var n = Object.assign({}, prev); n[src.name] = { state: 'fail' }; return n; });
          }).then(function () {
            done += 1;
            if (alive) { setProgress({ done: done, total: usable.length, count: total }); }
          });
        });
      });
      chain.then(function () { if (alive) { setScanDone(true); } });
      return function () { alive = false; };
    }, [screen, sources]);

    // 源不可用的项也标出来（不参与扫描）
    useEffect(function () {
      if (!sources) { return; }
      setScan(function (prev) {
        var n = Object.assign({}, prev);
        sources.forEach(function (s) {
          if (!s.available && !n[s.name]) { n[s.name] = { state: 'off' }; }
        });
        return n;
      });
    }, [sources]);

    // ---- ② 取窗口素材（summary；③ 复用同一份）----
    var reloadConversations = function () {
      setLoading(true); setConvErr('');
      api(convQuery(mode, date, start, end, 'summary')).then(function (data) {
        setPayload(data);
        // 已见过的记录沿用用户原来的勾选，只有这个窗口新出现的记录才默认勾上；
        // 这样从 ③ 退回 ② 换个日期再进来，不会把之前的选择悄悄清掉
        setChecked(function (prev) {
          var n = {};
          (data.projects || []).forEach(function (g) {
            (g.records || []).forEach(function (r) {
              n[r.id] = prev[r.id] === undefined ? true : prev[r.id];
            });
          });
          return n;
        });
        // 剪辑状态以服务端为准（保存剪辑会落进 trims.json，重新取数时带回来）
        setTrims(function () {
          var tm = {};
          (data.projects || []).forEach(function (g) {
            (g.records || []).forEach(function (r) { if (r.trim) { tm[r.id] = r.trim; } });
          });
          return tm;
        });
        setLoading(false);
      }).catch(function (e) {
        setLoading(false); setConvErr(e.message || '读取失败'); setPayload(null);
      });
    };

    useEffect(function () {
      if (screen !== 2) { return; }
      reloadConversations();
    }, [screen, mode, date, start, end]);

    // ---- ④ 模板清单 ----
    useEffect(function () {
      if (screen !== 4 || tplLoaded) { return; }
      setTplLoaded(true);
      api('/api/templates').then(function (list) {
        setTemplates(list || []);
        if (list && list.length) { selectTemplate(list[0].name); }
      }).catch(function (e) { setTplErr('读取模板失败：' + (e.message || '')); });
    }, [screen]);

    var selectTemplate = function (name) {
      setTplSel(name || '');
      if (!name) { setTplDetail(null); return; }
      api('/api/template?name=' + encodeURIComponent(name))
        .then(function (t) { setTplDetail(t); })
        .catch(function (e) { setTplErr('读取模板失败：' + (e.message || '')); });
    };

    // ---- 勾选 / 剪辑 ----
    var groups = (payload && payload.projects) || [];
    var picked = [];
    groups.forEach(function (g) {
      (g.records || []).forEach(function (r) { if (checked[r.id]) { picked.push(r.id); } });
    });
    var trimCount = picked.filter(function (id) { return !!trims[id]; }).length;

    var toggle = function (id) {
      setChecked(function (prev) { var n = Object.assign({}, prev); n[id] = !n[id]; return n; });
    };
    var toggleGroup = function (group) {
      var ids = (group.records || []).map(function (r) { return r.id; });
      var anyOff = ids.some(function (id) { return !checked[id]; });
      setChecked(function (prev) {
        var n = Object.assign({}, prev);
        ids.forEach(function (id) { n[id] = anyOff; });
        return n;
      });
    };
    var setAll = function (v) {
      var n = {};
      groups.forEach(function (g) { (g.records || []).forEach(function (r) { n[r.id] = v; }); });
      setChecked(n);
    };

    var saveTrim = function (rec, s, e) {
      setTrimErr('');
      post('/api/trim', { id: rec.id, start: s, end: e }).then(function (data) {
        setTrims(function (prev) {
          var n = Object.assign({}, prev);
          if (data.trim) { n[rec.id] = data.trim; } else { delete n[rec.id]; }
          return n;
        });
        setTrimRec(null);
      }).catch(function (err) { setTrimErr(err.message || '剪辑失败'); });
    };
    var clearAllTrims = function () {
      setTrimErr('');
      post('/api/trim', { clear: true }).then(function () {
        setTrims({});
      }).catch(function (err) { setTrimErr(err.message || '清空剪辑失败'); });
    };

    // ---- 学模板（base64 上传）----
    var learn = function (files) {
      setLearnNote('正在学排版…（本机解析，样例不上传）');
      setTplErr('');
      var reads = Array.prototype.map.call(files, function (f) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () {
            var t = String(fr.result);
            var i = t.indexOf(',');
            resolve({ name: f.name, data: i >= 0 ? t.slice(i + 1) : t });
          };
          fr.onerror = function () { reject(new Error('读取 ' + f.name + ' 失败')); };
          fr.readAsDataURL(f);
        });
      });
      Promise.all(reads).then(function (items) {
        return post('/api/learn', { files: items, name: learnName.trim() });
      }).then(function (data) {
        setLearnNote(data.pending_vision
          ? '样例是图片，本机不做识图。已存档，把读图提示连同图片交给 AI 回填。'
          : '已学成模板「' + data.name + '」（样例 ' + data.sample_count + ' 份），之后生成的报告都按它的排版。');
        return api('/api/templates').then(function (list) {
          setTemplates(list || []);
          selectTemplate(data.name);
        });
      }).catch(function (e) { setLearnNote('学习失败：' + (e.message || '')); });
    };

    // ---- 骨架预览（占位短句，不用真实会话内容）----
    var skeleton = [];
    var style = tplDetail ? tplDetail.style : null;
    groups.forEach(function (g) {
      var recs = (g.records || []).filter(function (r) { return checked[r.id]; });
      if (!recs.length) { return; }
      skeleton.push({ type: 'p', text: projLine(skeleton.filter(function (x) { return x.type === 'p'; }).length + 1, g.project, style) });
      recs.slice(0, 3).forEach(function (r, i) {
        skeleton.push({ type: 'i', mark: itemMark(i, style), text: '事项摘要占位（' + clip(cleanTitle(r), 12) + ' 的时间点）' });
      });
      if (recs.length > 3) {
        skeleton.push({ type: 'i', mark: '…', text: '另有 ' + (recs.length - 3) + ' 条素材交给 AI 一并归纳' });
      }
    });

    // ---- 导航 ----
    var goTo = function (next, d) {
      setDir(d);
      setScreen(next);
    };
    var jump = function (n) { goTo(n, n < stepNum ? -1 : 1); };
    var restart = function () {
      setSources(null); setScan({}); setScanDone(false); scanRef.current = false;
      setProgress({ done: 0, total: 0, count: 0 });
      setPayload(null); setChecked({}); setTrims({}); setTrimRec(null);
      setTemplates([]); setTplSel(''); setTplDetail(null); setTplLoaded(false);
      setLearnNote('本机解析，样例不上传；只学排版，不搬内容。'); setFmt('md');
      setSession(session + 1);
      setDir(-1);
      setScreen('splash');
    };

    var timeModeChange = function (next) {
      setConvErr('');
      if (next === 'range') {
        // 进「自定义时间」默认给近 7 天
        var e = end || todayIso();
        setEnd(e);
        if (!start || start > e) { setStart(shiftDays(e, -6)); }
      }
      setMode(next);
    };
    var dateChange = function (v) {
      if (!v) { return; }
      setConvErr('');
      if (mode === 'range' && end < v) { setEnd(v); }   // 起点晚于终点 → 拉终点
      setDate(v);
    };
    var startChange = function (v) {
      if (!v) { return; }
      setConvErr('');
      setStart(v);
      if (end && end < v) { setEnd(v); }
    };
    var endChange = function (v) {
      if (!v) { return; }
      setConvErr('');
      setEnd(v);
      if (start && start > v) { setStart(v); }
    };

    var convUrlFor = function (detail) { return convQuery(mode, date, start, end, detail); };
    var canGenerate = picked.length > 0;

    var tintMap = { splash: 0, 1: -10, 2: 10, 3: -22, 4: 16, gen: -6 };
    var tint = tintMap[screen] === undefined ? 0 : tintMap[screen];

    // ---- 渲染 ----
    var current = null;
    if (screen === 1) {
      current = <StepSources key="s1" dir={dir} sources={sources || []} scan={scan} progress={progress}
                            done={scanDone} onNext={function () { goTo(2, 1); }} />;
    } else if (screen === 2) {
      current = <StepTime key="s2" dir={dir} mode={mode} date={date} start={start} end={end}
                         payload={payload} loading={loading} error={convErr}
                         onMode={timeModeChange} onDate={dateChange} onStart={startChange} onEnd={endChange}
                         onRetry={reloadConversations}
                         onNext={function () { goTo(3, 1); }} onBack={function () { goTo(1, -1); }} />;
    } else if (screen === 3) {
      current = <StepRecords key="s3" dir={dir} payload={payload} loading={loading} error={convErr}
                             checked={checked} trims={trims} picked={picked} trimCount={trimCount}
                             onAll={function () { setAll(true); }} onNone={function () { setAll(false); }}
                             onToggle={toggle} onToggleGroup={toggleGroup} onClearTrims={clearAllTrims}
                             onTrim={function (rec) { setTrimErr(''); setTrimRec(rec); }}
                             onRetry={reloadConversations}
                             onNext={function () { goTo(4, 1); }} onBack={function () { goTo(2, -1); }} />;
    } else if (screen === 4) {
      current = <StepTemplate key="s4" dir={dir} templates={templates} selected={tplSel} detail={tplDetail}
                              skeleton={skeleton} fmt={fmt} learnName={learnName} learnNote={learnNote}
                              loading={!tplLoaded} error={tplErr} canGenerate={canGenerate}
                              onSelect={selectTemplate} onFmt={setFmt} onLearn={learn}
                              onLearnName={setLearnName}
                              onGenerate={function () { goTo('gen', 1); }}
                              onBack={function () { goTo(3, -1); }} />;
    } else if (screen === 'gen') {
      current = <Generating key="gen" dir={dir} ids={picked} mode={mode} date={date} start={start}
                           end={end} fmt={fmt} template={tplSel}
                           onBack={function () { goTo(4, -1); }} />;
    }

    return (
      <React.Fragment>
        <div className="aurora" aria-hidden="true"
             style={{ filter: 'hue-rotate(' + tint + 'deg)' }}>
          <i className="b1"></i><i className="b2"></i><i className="b3"></i>
        </div>

        <div className="relative z-10">
          {screen !== 'splash' ? (
            <TopBar current={stepNum} onJump={jump} onRestart={restart} />
          ) : null}
          <main className="min-h-screen px-0 pb-24 pt-28 md:pt-32">
            <AnimatePresence mode="wait" initial={false} custom={dir}>
              {current}
            </AnimatePresence>
          </main>
          {screen !== 'splash' ? <Footer /> : null}
        </div>

        <AnimatePresence>
          {screen === 'splash' ? (
            <Splash key={'splash-' + session}
                    onDone={function (list) { setSources(list); setDir(1); setScreen(1); }} />
          ) : null}
        </AnimatePresence>

        <AnimatePresence>
          {trimRec ? (
            <TrimPanel key="trim" record={trimRec} trims={trims} error={trimErr}
                       onClose={function () { setTrimRec(null); }}
                       onSave={function (s, e) { saveTrim(trimRec, s, e); }} />
          ) : null}
        </AnimatePresence>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
